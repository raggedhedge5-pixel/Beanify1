// Fabric builds for Minecraft 26.1+ (unobfuscated game: no mappings, no remapping).
// Build one target:   gradle build -PbeanTarget=fabric-26.2
// Targets live in ../build-matrix.json
import groovy.json.JsonSlurper

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def matrix = new JsonSlurper().parse(file("${rootDir}/../build-matrix.json"))
def targetId = findProperty('beanTarget')
def cfg = targetId ? matrix.targets.find { it.id == targetId } : matrix.targets.find { it.project == projectDir.name }
if (cfg == null) {
    throw new GradleException("Unknown beanTarget '${targetId}'. Valid ids: ${matrix.targets.findAll { it.project == projectDir.name }*.id}")
}
logger.lifecycle("Beanify target ${cfg.id}: Minecraft ${cfg.minecraft_version}, Java ${cfg['java']}, mixin variant ${cfg.mixin_variant}")

version = project.mod_version
group = 'dev.beanify'

base {
    archivesName = "beanify-fabric-${cfg.range_label}"
}

dependencies {
    minecraft "com.mojang:minecraft:${cfg.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

sourceSets {
    main {
        java.srcDir "${rootDir}/../common/${cfg.mixin_variant}/java"
        resources.srcDir "${rootDir}/../common/${cfg.mixin_variant}/resources"
    }
}

processResources {
    def props = [
        version      : project.version.toString(),
        mc_dependency: cfg.mc_dependency,
        java         : cfg['java'].toString(),
        mixin_compat : cfg.mixin_compat,
    ]
    inputs.properties props
    filesMatching(['fabric.mod.json', 'beanify.mixins.json']) {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = cfg['java'] as Integer
}

java {
    sourceCompatibility = JavaVersion.toVersion(cfg['java'])
    targetCompatibility = JavaVersion.toVersion(cfg['java'])
}

jar {
    from('../LICENSE') {
        rename { "${it}_beanify" }
    }
}
