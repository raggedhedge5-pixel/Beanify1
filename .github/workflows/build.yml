name: Build all jars

# Builds one jar per target in build-matrix.json. Run it from the Actions tab ("Run workflow"),
# then download each "beanify-<target>" artifact and upload it to Modrinth.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.m.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        # Gradle itself needs at least JDK 21; the mod is still compiled with --release <target java>.
        run: |
          echo "targets=$(jq -c '[.targets[] | {id, project, java: (if .java < 21 then 21 else .java end)}]' build-matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one broken target must not hide the others
      matrix:
        target: ${{ fromJson(needs.matrix.outputs.targets) }}
    name: ${{ matrix.target.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.target.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Architectury Loom (Forge) is the one most likely to lag behind a brand-new Gradle.
          gradle-version: ${{ matrix.target.project == 'forge' && '8.14.3' || 'current' }}
      - name: Build
        working-directory: ${{ matrix.target.project }}
        shell: bash
        run: |
          set -o pipefail
          gradle build -PbeanTarget=${{ matrix.target.id }} --no-daemon --stacktrace 2>&1 | tee ../build.log
      - name: Show errors on the run summary page
        if: failure()
        shell: bash
        run: |
          {
            echo "### FAILED: ${{ matrix.target.id }}"
            echo '```'
            grep -E -m15 -A2 'error:' build.log | cut -c1-250 || true
            grep -m1 -A18 'What went wrong' build.log | cut -c1-250 || true
            echo '--- last lines ---'
            tail -n 15 build.log | cut -c1-250
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: beanify-${{ matrix.target.id }}
          path: |
            ${{ matrix.target.project }}/build/libs/*.jar
            !${{ matrix.target.project }}/build/libs/*-sources.jar
            !${{ matrix.target.project }}/build/libs/*-dev.jar
          if-no-files-found: error
